name: Fuzz

# Periodic fuzzing job: runs each cargo-fuzz target for a few minutes to
# catch panics on malformed input. Triggered daily and on manual dispatch.
# Each target's corpus is kept in the Actions cache between runs, so
# coverage builds up over days instead of restarting from the seeds.
#
# To run locally for the same duration:
#   cargo +nightly fuzz run <target> -- -max_total_time=<seconds>
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC every day
  workflow_dispatch: {} # allow manual runs from the Actions tab
  push:
    paths:
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The decode targets get more time: the macroblock layer they reach
        # is far larger than the parsers
        include:
          - { target: parse_annex_b, seconds: 180 }
          - { target: parse_avcc, seconds: 180 }
          - { target: parse_avcc_config, seconds: 180 }
          - { target: decode_annex_b, seconds: 600 }
          - { target: decode_avcc, seconds: 600 }
          # Slice-data inputs are a stream index plus 4-byte edits: allow up
          # to 16 edits from the start instead of growing the length slowly
          - { target: decode_slice_data, seconds: 900, args: '-max_len=65 -len_control=0' }
          - { target: decode_threaded, seconds: 600, args: '-max_len=65 -len_control=0' }
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            fuzz/target/
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'fuzz/Cargo.toml') }}
          restore-keys: |
            fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Restore corpus from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Seed corpus from test data (whole-stream decode targets)
        if: matrix.target == 'decode_annex_b' || matrix.target == 'decode_avcc'
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          # Small streams only: the multi-MB bench streams (and mutants of
          # them, truncated to the 1 MB max input) decode tens of full
          # 1080p pictures and exceed -timeout in the instrumented build.
          find testdata -maxdepth 1 -name '*.h264' -size -300k \
            -exec cp {} fuzz/corpus/${{ matrix.target }}/ \;

      - name: Seed corpus with the base streams (slice-data targets)
        if: matrix.target == 'decode_slice_data' || matrix.target == 'decode_threaded'
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          # One single-byte input per base stream in
          # fuzz/common/slice_mutation.rs (22 streams)
          for i in $(seq 0 21); do
            printf "\\$(printf %03o $i)" > fuzz/corpus/${{ matrix.target }}/seed_$i
          done

      - name: Run fuzz target
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} \
            -- -max_total_time=${{ matrix.seconds }} -timeout=10 ${{ matrix.args }}

      - name: Minimize corpus
        # Keeps only inputs that add coverage, so the corpus loaded at the
        # start of each run stays small as it accumulates
        run: cargo +nightly fuzz cmin ${{ matrix.target }} -- -timeout=10

      - name: Save corpus for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
